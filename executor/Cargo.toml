[package]
name = "arb-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
arb-engine = { path = "../engine" }
solana-streamer-sdk = { path = "../solana-streamer" }
solana-sdk = "3.0.0"
solana-client = "3.1.9"
tokio = { version = "1.50.0", features = ["full"] }
tonic = "0.14.5"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rand = "0.8"
bs58 = "0.5"
base64 = "0.22"
