[package]
name = "arb-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
arb-engine = { path = "../engine" }
solana-streamer-sdk = { path = "../solana-streamer" }
solana-sdk = "3.0.0"
solana-client = "3.1.9"
solana-commitment-config = "3.1.1"
tokio = { version = "1.50.0", features = ["full"] }
tonic = { version = "0.12", features = ["channel", "tls", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rand = "0.8"
rayon = "1.10"
bincode = "1.3"
solana-compute-budget-interface = "3.0.0"
solana-system-interface = "2.0.0"
bs58 = "0.5"
base64 = "0.22"
solana-account-decoder = "3.1.9"

[build-dependencies]
tonic-build = "0.12"
