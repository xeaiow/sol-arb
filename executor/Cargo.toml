[package]
name = "arb-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
arb-engine = { path = "../engine" }
solana-streamer-sdk = { path = "../solana-streamer" }
solana-sdk = "3.0.0"
solana-client = "3.1.9"
solana-commitment-config = "3.1.1"
tokio = { version = "1.50.0", features = ["full"] }
tonic = { version = "0.12", features = ["channel", "tls", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rand = "0.8"
rayon = "1.10"
bincode = "1.3"
solana-compute-budget-interface = "3.0.0"
solana-system-interface = "2.0.0"
bs58 = "0.5"
base64 = "0.22"
arrayvec = "0.7"
futures = "0.3"
astralane-quic-client = { git = "https://github.com/Astralane/astralane-quic-client" }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring", "std"] }
rcgen = "0.13"
solana-account-decoder = "3.1.9"
spl-associated-token-account = "6.0.0"

[[bin]]
name = "test_cross_dex"
path = "src/bin/test_cross_dex.rs"

[[bin]]
name = "test_dex_cpi"
path = "src/bin/test_dex_cpi.rs"

[[bin]]
name = "test_pumpswap_direct"
path = "src/bin/test_pumpswap_direct.rs"

[[bin]]
name = "test_send_arb"
path = "src/bin/test_send_arb.rs"

[[bin]]
name = "test_arb_quote"
path = "src/bin/test_arb_quote.rs"

[[bin]]
name = "test_quic_direct"
path = "src/bin/test_quic_direct.rs"

[[bin]]
name = "test_quic_send"
path = "src/bin/test_quic_send.rs"

[[bin]]
name = "test_gpa"
path = "src/bin/test_gpa.rs"

[[bin]]
name = "verify_damm_v2"
path = "src/bin/verify_damm_v2.rs"

[[bin]]
name = "verify_dlmm"
path = "src/bin/verify_dlmm.rs"

[[bin]]
name = "verify_whirlpool"
path = "src/bin/verify_whirlpool.rs"

[build-dependencies]
tonic-build = "0.12"
